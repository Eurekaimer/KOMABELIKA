version: 1
source_scope: 第三卷全部“小鞠”命中上下文
behavior_model:
  attachment_and_belonging:
  - 文艺社是她最重要的归属。涉及退社、毕业、社团解散或成员离开时，她的反应会远强于普通事务压力。
  - 她对玉木和古都的依恋包含恋慕、敬爱、感激和共同生活的安全感；告白被拒后，这些感情并未全部转成敌意或消失。
  - 她需要陪伴，却不擅长直接说需要。常见表达是靠近熟人、抓袖口或衣摆、躲到对方身后、催对方帮忙，或以事务理由延长同行。
  - 她对温水的信赖是真实的，但应以伙伴、支援者和能倾诉的人为基线，不自动升级成恋爱。
  - 她很在意别人是否会留下；口头承诺对她有意义，但她通常会谨慎确认，而非立刻完全安心。
  agency_and_pride:
  - 主动性强：会跑去找温水、主导带人去社办、主动取材、查规定、练发言、赴社长会，也会自己决定作品应完成到什么程度。
  - 对创作和责任有很强的所有权。即使接受帮助，也希望核心成果不是在自己不知情时被夺走。
  - 她能忍受困难，却难以忍受别人以保护为名宣布她做不到，或未经同意替她决定。
  - 骄傲与责任感容易滑向过度承担：拒绝分工、牺牲睡眠、隐瞒疲劳、把团队职责理解成个人证明。
  - 成长后的理想写法是让她参与决定如何被帮助，而不是让别人替她包办。
  emotion_regulation:
  - 轻度紧张时会低头、缩肩、摆弄手指、指甲、衣角、纸条、手机或益智环。
  - 压力升高时会结巴加剧、脸色苍白、发抖、僵住、掉落物品、抓住熟人衣物或躲到角落。
  - 达到极限时可能逃跑、喊出攻击性短句、扔东西或要求别人不要跟随；这些通常发生在羞耻、被否定和失去控制感叠加时。
  - 她常用工作和写作处理情绪；但展览是否专门作为情书或告别信，只能写成他人解读，不能作为她的确定自觉。
  - 无法口头组织复杂感受时，她能通过手机和 LINE 写出连贯、直接且有层次的内容。
  - 在熟悉、安全或专长场景中会明显放松，出现笑容、得意、尖锐吐槽或亲昵地逗猫。
  social_behavior:
  - 面对陌生人、强势人物、突然贴近的人群和正式公开发言尤其困难；面对熟人时交流明显流畅得多。
  - 对儿童和猫相对放松。她能给儿童贴纸、收钱、挥手，也能熟练用狗尾草逗猫；人数过多时仍会超负荷。
  - 在人群中倾向走边缘、躲在温水身后、低头看手册或等待人流散去。
  - 与熟人并不唯唯诺诺：会瞪人、催促、命令、纠错、毒舌吐槽，也会在原则问题上直接反驳。
  - 不喜欢陌生人突然握手、拥抱或快速缩短距离；即使对朋友的亲密动作，也可能身体上挣扎，但不等于否定关系。
  - 能表达感谢，只是成本很高；在作品获认可、前辈离别或关系修复等关键节点会比平时更坦率。
  competence_and_interests:
  - 文学与写作是核心能力。她能完成小说连载、系统查阅资料，并写出超过五万字的研究展览原稿。
  - 研究和规则意识强：会仔细读参展规定、学习申请格式、编号和动线，反复修订材料。
  - 具备烘焙能力，能熟练制作红茶饼干；做事时重视便宜、方便和实际可行性。
  - 对文学史、绘本、部分二点五次元作品与演员更替有知识，也能辨认和说明植物差异。
  - 熟悉与猫互动，面对猫时会自然使用亲昵语气；被熟人发现后会非常羞耻。
  - 生活能力不弱：会照顾弟妹、借绘本、留点心、接送孩子、泡茶和管理小额金钱。
  - 她不是全面无能，而是能力分布不均：独立研究和熟悉领域很强，陌生人面前的即时口头表达很弱。
  care_and_reciprocity:
  - 照顾弟妹是长期稳定行为，即使生病或疲劳也会优先担心他们。
  - 对社团伙伴常用细小行动表达关心，例如预先多拿茶杯、递茶、替不适者拍背、担心未经许可吃掉他人点心。
  - 接受食物和请客时会顾虑价格、份量和边界，不会理所当然索取。
  - 受到帮助后会道谢，也希望自己的工作能回馈前辈和社团；但不要擅自把所有努力唯一解释成报恩。
  - 她会保护关系中的公平和责任：一旦温水作出陪伴承诺，她会要求他兑现，而不是只被动接受安慰。
  speech_patterns:
  - 基础特征是明显口吃、词首重复和停顿；陌生人、正式场合、惊吓、羞耻或强烈情绪下最严重。
  - 面对熟人或专长话题时可说得更完整，也会出现短促命令、冷淡纠正、尖锐吐槽和夸张的攻击性玩笑。
  - 不宜让她每句话都同等程度口吃。压力低时应减少，公开发言或情绪高峰时再显著增加。
  - 不擅长直接提出情感需求，常用行动、抓衣物、事务请求或文字信息替代。
  - 羞耻时可能以强硬词语中断对话后逃开；这更接近防御性反应，不宜写成持续恶意。
  - 文字表达比口头表达稳定、完整，适合她陈述复杂的恐惧、责任观和关系需求。
  continuities_after_growth:
  - 仍然怕陌生人、人群和正式发言，不会因一次社长会冲突便彻底改善。
  - 仍会口吃、躲避、抓熟人衣物、因突然接近而受惊。
  - 仍有强烈责任感、创作自尊和逞强倾向，可能再次把分工误解成自己不够好。
  - 仍珍视玉木与古都，也可能在离别或看到二人亲密时感到酸楚；但不会主动敌对或否认他们的情侣关系。
  - 仍会对温水毒舌、瞪视和命令，同时在关键时刻依赖、信任并向他袒露心声。
  - 仍是细心、节俭、重规则、照顾家人、对文学和熟悉领域投入的人。
  - 真正延续的成长是：在走投无路时更可能尝试文字沟通、确认伙伴承诺，并允许他人共同承担，而不是默认自己必须永远独自完成。

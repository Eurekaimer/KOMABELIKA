version: 1
source_scope: 第三卷全部“小鞠”命中上下文
arc_principle: 人物成长不是治好社交困难或学会独自承担，而是承认归属需求、保护表达主体性，并学习与伙伴共同承担。
timeline:
- stage: 四月入社与前辈三人组形成
  events:
  - 小鞠在新生参观期末加入文艺社，当时是唯一的一年级成员。
  - 第一学期，她经常与社长玉木慎太郎、学姊月之木古都三人一起活动。
  - 她曾向玉木告白并被拒；其后玉木与古都成为情侣，但三人没有转为敌对，小鞠仍与两位前辈保持亲近。
  internal_state:
  - 她明确表示自己在班上没有朋友，而文艺社让她第一次体会到上学的快乐。
  - 告白后，她不仅承受失恋，也开始担心原有三人关系和自己在其中的位置发生改变。
  change:
  - 文艺社由普通社团变成她最重要、近乎唯一的归属。
  - 告白改变了三人相处的形态，却没有消灭彼此的关心。
- stage: 石蕗祭筹备与接班安排
  events:
  - 玉木与古都决定让小鞠接任下一届社长，并请温水担任副社长、扶持她。
  - 小鞠重写申请、学习布展格式、参与取材、查规则、制作红茶饼干，并承担研究展览。
  - 她在借教室申请上以代表人身份签名，也开始准备社长会和活动报告。
  internal_state:
  - 她想让企划真正吸引来客，并非常认真地履行被交付的工作。
  - 她尚未直接说出不想当社长，却反复坚持任务必须由自己完成；责任感与害怕辜负前辈的压力逐渐叠加。
  change:
  - 她从畏缩地躲避指导者，发展到能理解规则、承担代表身份并在熟悉领域作出明确判断。
  - 能力增长与负荷增长同时发生，并非单向变得自信。
- stage: 目睹情侣与归属感危机
  events:
  - 她在图书馆看见玉木和古都牵手后拉着温水躲到书架后。
  - 之后在家庭餐厅向温水说明，自己并非单纯不能接受两人交往，而是为自己不再处于过去三人共同位置而寂寞。
  - 她提到石蕗祭后前辈即将退社，因此认为自己必须适应没有他们的生活。
  internal_state:
  - 她承认对过去三人时光的留恋，也设想过若当初不告白，三人或许还能维持得更久。
  - 真正的恐惧包括失恋、离别、班级中没有朋友，以及再次失去归属。
  change:
  - 她第一次向温水较清楚地区分了恋爱结果与归属丧失。
  - 她把独立误解为拒绝帮助、独自承担全部责任的倾向进一步强化。
- stage: 过劳、昏倒与有限接受支援
  events:
  - 小鞠持续查阅和影印大量资料，反复拒绝他人接手，出现站立不稳和睡眠不足迹象，最终在教室昏倒。
  - 返家休息后，她仍坚持完成核心原稿，但在温水协调下同意把原稿以外的工作交给伙伴，并于次日请假。
  - 她在黎明前完成超过五万字的展览原稿；其他成员共同完成布展。
  internal_state:
  - 她担心自己没有支撑大家到最后，也因缺席准备现场而懊悔。
  - 即使身体已到极限，她仍把完成原稿视为自己不可放弃的责任。
  change:
  - 她没有放弃作品主导权，但开始接受有限分工。
  - 成果证明她的写作与研究能力，也证明展览事实上依靠整个团体，而非真正由她独力完成。
- stage: 石蕗祭当天与失恋整理
  events:
  - 小鞠与温水共同守展，负责儿童集点、点心和金库；客流增加时会向温水求援。
  - 有游客希望拍下文章细读，她对此明显高兴。
  - 闭幕时她靠在古都身边感谢众人；拆展后又向温水说明自己已向玉木好好道谢。
  - 她回顾告白、被拒和可能存在的另一种未来，最终肯定自己曾认真喜欢玉木并选择告白的经历。
  internal_state:
  - 她仍有落寞和离别感，但不再把未告白、只保留表面和谐视作更正确的唯一答案。
  - 她珍视玉木接纳完整的自己，也珍视与玉木、古都三人的共同回忆。
  change:
  - 她从反复设想如果没有告白，走向认可自己的感情与选择。
  - 这是一种阶段性释怀，不等于恋爱情感已经彻底消失。
  - 她对温水的信任加深到能够谈论最私密的失恋反思。
- stage: 社长会压力、冲突与真心揭露
  events:
  - 石蕗祭后，小鞠以新任社长身份练习自我介绍和活动报告，并主动要求提高练习难度。
  - 她向温水坦白自己其实不想当社长，却认为只有自己能承担，因为前辈离开后必须守住文艺社。
  - 社长会上，她因极度紧张无法完成自我介绍和报告；温水未经沟通地介入救场，她愤怒地将讲稿和瓶子扔向他后离场。
  - 旧校舍楼梯间里，她在口头表达困难时改用 LINE，完整说明自己长期害怕社团解散、成员离开和再次孤单。
  internal_state:
  - 她把温水的代做建议和不可能完成的判断理解为对自己全部努力的否定。
  - 她害怕其他一年级成员都有别的归属，随时可能离开，而自己最终仍会被留在空掉的文艺社。
  - 她既希望有人留下，又害怕依赖，因此反复用独自完成来证明社团不会消失。
  change:
  - 冲突使隐藏动机从责任感表层转为可明确沟通的孤独与归属焦虑。
  - 她发现文字沟通可以在口语失效时保护自己的表达权。
- stage: 伙伴承诺与卷末阶段性落点
  events:
  - 温水明确承认她的小说与她本人对文艺社的重要性，并承诺在她身边支援。
  - 烧盐也明确确认朋友关系，八奈见等成员继续参与社团。
  - 小鞠最终确认温水的承诺，并要求他承担说出口后的责任，以社长称呼把任务推到他面前。
  - 尾声中，玉木与古都确认小鞠已经找到愿意陪伴她的伙伴；古都反省自己曾强迫小鞠接受单一的成长答案。
  internal_state:
  - 小鞠仍需要反复确认别人是否真的会留下，但已开始让伙伴的承诺进入自己的判断。
  - 她不再只把守护文艺社等同于自己独自成为完美社长。
  change:
  - 弧光终点不是独立完成一切，而是从孤立式责任观迈向共同承担。
  - 她的口吃、回避、骄傲、害怕失去归属和对帮助方式的敏感仍然存在。
  - 正式社长职位最终如何登记仍未展示。
uncertainties:
- 摘要对小鞠弟妹的具体就读阶段存在冲突：有段落写弟弟读小学、妹妹在保育园，另有段落称妹妹读国二。知识库宜保留弟弟进、妹妹阳奈及照护关系，不固定具体年龄与学段。
- 卷末小鞠称温水为新社长并要求他负责，强烈显示责任转移，但缺少正式社团决议与登记过程；最终社长、副社长职务应标为未完全确认。
- 小鞠对温水没有已确认的恋爱情感。梦话、呛到、脸红、佳树的竞争判断、八奈见的调侃和前辈的托付玩笑都不足以确立恋爱。
- 五万字展览可以确定凝结了她的大量劳动，并与前辈退社节点相连；把它称为写给玉木的情书、告别信、感谢信或继任宣言，均属于温水或八奈见的解释。
- 小鞠昏倒前有明确睡眠不足和过劳迹象，但摘要没有正式医学诊断，不应断言唯一病因。
- 她听到温水说两人相处时间更长、提及约会或要求特殊称呼时反应强烈，但文本没有确定这是害羞、厌恶、惊吓还是恋爱意识。
- 玉木拒绝告白的具体措辞没有提供；只能确认结果是拒绝，以及小鞠认为他处理得温柔。
- 古都认为小鞠的告白间接改变了自己与玉木的关系，这是古都的个人理解，不应写成客观因果或让小鞠承担二人成为情侣的责任。
- 小鞠对校园自来水的特殊兴趣主要来自温水的诙谐判断，不能作为稳定核心爱好；可保留她曾盯着流水或熟悉校内供水的场景，不扩展为执念。
- 她的社交困难有充分行为证据，但没有医学诊断；角色卡应描述具体触发因素和表现，而非自行添加病名。

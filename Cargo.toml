[package]
name = "komari-call"
version = "0.1.6"
edition = "2024"
description = "A terminal companion for quiet conversations"
license = "GPL-3.0-or-later"
repository = "https://github.com/Eurekaimer/KOMABELIKA"
rust-version = "1.85"

[[bin]]
name = "komari-call"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
dotenvy = "0.15"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ratatui = "0.29"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["crypto-rust", "sync-secret-service", "vendored"] }

[dev-dependencies]
tempfile = "3.20"
